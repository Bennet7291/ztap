[package]
name    = "ztap-macos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ztap-core = { path = "../../core" }

# WARNING: this crate could not be compiled in the environment it was
# written in (no macOS/Xcode toolchain available -- see input_method.rs's
# module doc comment). Feature lists below reflect fixes applied in
# response to real CI build errors, not pure speculation -- see the
# fix-history notes below -- but should still be treated as unverified
# until CI reports a full, clean build.
#
# Fix history:
#   1. objc2_core_graphics and objc2_core_text were removed entirely.
#      candidate_window.rs originally hand-drew candidate rows with raw
#      CoreGraphics/CoreText calls; CI reported a long chain of unresolved
#      imports and type mismatches against those two crates (CGContextRef/
#      CGRect/CGPoint/CGSize not at the expected paths, CTFrame/
#      CTFramesetter not at the crate root, kCTFontAttributeName missing,
#      CFRange in the wrong crate). Rather than keep guessing at that
#      binding surface, candidate_window.rs was rewritten to use
#      NSTextField labels instead (per objc2's own verified docs.rs
#      example), which needs neither crate -- see that file's module doc
#      comment for the full rationale.
#   2. NSTextField (for the rewrite above) added to objc2-app-kit's feature
#      list. NSTextAlignment (used to left-align candidate text) is not a
#      standalone Cargo feature -- CI's error printed the full valid
#      feature list, confirming `setAlignment` (an NSTextField/
#      NSSegmentedControl setter, per objc2-app-kit's own generated docs)
#      is gated behind the general "NSText" feature instead; the
#      NSTextAlignment *type* itself ships as part of that. Swapped below.
objc2 = { version = "0.6", features = ["relax-void-encoding"] }
objc2-foundation = { version = "0.3", features = [
    "NSString", "NSArray", "NSDictionary", "NSAttributedString",
    "NSBundle", "NSRange", "NSGeometry",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication", "NSResponder", "NSWindow", "NSPanel", "NSView",
    "NSColor", "NSFont", "NSScreen", "NSTextField", "NSText",
    "NSGraphics", "NSWindowRestoration",
] }
objc2-input-method-kit = { version = "0.3", features = [
    "IMKServer", "IMKInputController", "objc2-app-kit",
] }

[[bin]]
name = "Ztap"
path = "src/main.rs"
