name: Build ztap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ztap-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ztap-windows-x64

    runs-on: ${{ matrix.os }}

    steps:

      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------
      # Rust
      # -------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}


      # -------------------------
      # Cargo cache
      # -------------------------
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}


      # -------------------------
      # Build workspace
      # -------------------------
      - name: Build
        shell: bash
        run: |
          cargo build \
            --workspace \
            --release \
            --target ${{ matrix.target }}


      # ==================================================
      # macOS InputMethodKit bundle
      # ==================================================
      - name: Package macOS
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          mkdir -p dist

          mkdir -p dist/ztap.app/Contents/MacOS

          cp \
            target/${{ matrix.target }}/release/ztap \
            dist/ztap.app/Contents/MacOS/


          cp \
            platform/macos/Info.plist \
            dist/ztap.app/Contents/


          tar czf \
            dist/${{ matrix.artifact }}.tar.gz \
            -C dist \
            ztap.app



      # ==================================================
      # Windows TSF DLL
      # ==================================================
      - name: Package Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |

          New-Item -ItemType Directory -Force dist | Out-Null


          Copy-Item `
            target/${{ matrix.target }}/release/*.dll `
            dist/ `
            -ErrorAction SilentlyContinue


          Copy-Item `
            target/${{ matrix.target }}/release/*.exe `
            dist/ `
            -ErrorAction SilentlyContinue


          Compress-Archive `
            -Path dist/* `
            -DestinationPath dist/${{ matrix.artifact }}.zip



      # -------------------------
      # Upload artifacts
      # -------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
